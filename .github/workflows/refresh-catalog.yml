name: Refresh public app catalog

on:
  workflow_dispatch:
    inputs:
      rebuild_public_github_results:
        description: Rebuild the GitHub slice using explicit public-only searches
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh, merge, and classify candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ inputs.rebuild_public_github_results }}" = "true" ]; then
            args+=(--reset-github-results)
          fi
          python scripts/refresh_catalog.py "${args[@]}"
      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.csv data/apps.jsonl data/catalog-stats.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Refresh agent app discovery catalog"
            git push origin HEAD:main
          fi
